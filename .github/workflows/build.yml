            }
            c.fillStyle='#0a0a12';
            for(let i=0;i<add.length;i+=2)c.fillRect(add[i],add[i+1],1,1);
          }

          /* ---------- كارثوس: عملاق سايركس (90 متراً) ---------- */
          function buildKarthus(){
            const r=rng(777),c=mkc(120,112);
            const cols=['#9aae9b','#8fa291','#6a7c70','#4e5c54'];
            const pick=()=>cols[r()<0.15?3:r()<0.4?2:1];
            for(let y=26;y<84;y++){
              const t=(y-26)/58,hw=Math.round(lerp(52,30,t)+Math.sin(y*0.7)*2);
              for(let x=60-hw;x<=60+hw;x++){
                c.fillStyle=x<60-hw+3?cols[0]:pick();c.fillRect(x,y,1,1);
              }
            }
            c.fillStyle='#e0d8b4';
            for(let i=0;i<4;i++){
              const y=34+i*7;
              for(let x=40;x<=80;x++){const yy=y+Math.round(Math.abs(x-60)/8);if((x&1)||i%2)c.fillRect(x,yy,1,2);}
            }
            c.fillStyle='#2a0c14';c.fillRect(46,62,28,12);
            c.fillStyle='#e0d8b4';
            for(let x=46;x<74;x+=3){c.fillRect(x,62,2,4);c.fillRect(x+1,70,2,4);}
            c.fillStyle='#7a1a2a';c.fillRect(34,50,8,2);c.fillRect(80,44,6,2);
            for(let s=0;s<2;s++){
              const lx=s?66:28;
              for(let y=84;y<112;y++)for(let x=lx;x<lx+26;x++){
                if(y>108&&(x<lx+2||x>lx+23))continue;
                c.fillStyle=pick();c.fillRect(x,y,1,1);
              }
            }
            for(let y=0;y<28;y++){
              const hw=Math.round(18-Math.pow((y-14)/14,2)*6);
              for(let x=60-hw;x<=60+hw;x++){c.fillStyle=pick();c.fillRect(x,y,1,1);}
            }
            c.fillStyle='#ff3a3a';c.fillRect(48,8,6,5);c.fillRect(67,8,6,5);
            c.fillStyle='#fff';c.fillRect(50,9,2,2);c.fillRect(69,9,2,2);
            c.fillStyle='#2a0c14';c.fillRect(49,18,23,7);
            c.fillStyle='#e0d8b4';
            for(let x=49;x<72;x+=3){c.fillRect(x,18,2,3);c.fillRect(x+1,22,2,3);}
            outlineCv(c.cv);
            return c.cv;
          }
          function buildKarm(){
            const r=rng(555),c=mkc(22,74);
            const cols=['#9aae9b','#8fa291','#6a7c70','#4e5c54'];
            for(let y=0;y<58;y++){
              const hw=Math.round(10-y*0.04);
              for(let x=11-hw;x<=11+hw;x++){c.fillStyle=cols[x<11-hw+2?0:(r()<0.2?3:r()<0.45?2:1)];c.fillRect(x,y,1,1);}
            }
            c.fillStyle='#e0d8b4';
            for(let k=0;k<3;k++){const bx=4+k*7;for(let y=0;y<14;y++){c.fillRect(bx+Math.round((1-y/14)*2),58+y,Math.max(1,3-Math.floor(y/5)),1);}}
            outlineCv(c.cv);
            return c.cv;
          }
          ET.karthus={hp:60,w:70,h:100,heavy:1,
            ai(e){
              const dx=P.x-e.x,ad=Math.abs(dx),en=e.hp<e.maxhp*0.5;
              e.d=dx>0?1:-1;
              if(!e.half&&en){e.half=true;say(D.ep13b);}
              if(P.dead)return;
              if(e.st==='walk'||e.st==='idle'){
                if(ad>50)e.x+=e.d*(en?0.5:0.3);
                e.cd--;
                if(e.cd<=0){e.st=ad<85?'stomp':'slam';e.at=0;}
              }else if(e.st==='slam'){
                e.at++;
                if(e.at===40){
                  L.sh.push({x:e.x+e.d*46,y:GY-6,vx:e.d*(en?3.6:2.6),d:e.d,dmg:2,life:170,own:'e',type:'orb'});
                  sfx('boom');L.shake=10;
                }
                if(e.at>62){e.st='walk';e.cd=en?55:105;}
              }else if(e.st==='stomp'){
                e.at++;
                if(e.at===35){
                  if(ad<95&&P.y>=GY-10)hurtPlayer(2,e.x);
                  sfx('boom');L.shake=12;burst(e.x+e.d*20,GY-4,20,['#6a7c70','#9aae9b','#e0d8b4'],3);
                }
                if(e.at>56){e.st='walk';e.cd=75;}
              }
            },
            draw(c,e,cam){
              c.save();c.translate(Math.round(e.x-cam),Math.round(e.y));c.scale(e.d,1);
              if(e.fl>0)c.filter='brightness(2.6)';
              const bob=Math.round(Math.sin(e.t*0.05));
              c.save();c.translate(-46,-80+bob);c.rotate(0.15+Math.sin(e.t*0.04)*0.08);c.drawImage(S.karm,-11,0);c.restore();
              c.drawImage(S.kbody,-60,-112+bob);
              let th=0.1+Math.sin(e.t*0.04)*0.06;
              if(e.st==='slam'){
                if(e.at<35)th=-2.8*(e.at/35);
                else if(e.at<45)th=lerp(-2.8,-0.5,(e.at-35)/10);
                else th=-0.5;
              }else if(e.st==='stomp')th=-0.9*Math.min(1,e.at/30);
              c.save();c.translate(46,-80+bob);c.rotate(th);c.drawImage(S.karm,-11,0);c.restore();
              c.restore();
            }};

          /* ---------- الحلقات والمراحل ---------- */
          let EPI=0;
          function setArmed(b){G.armed=b;S.lsword=b?S.swordReal:S.blank;}
          const _sf=slashFx;slashFx=function(){if(G.armed)_sf.apply(null,arguments);};
          retryLevel=function(){L.def.retry=1;startLevel(L.def);};
          function nextEp(){EPI++;startEpisode(EPI);}
          const first=()=>!L.def.retry;
          const hol=n=>{const a=[];for(let i=0;i<n;i++)a.push({type:'hollow',dx:i*14});return a;};

          const EP=[
          {card:['الحلقة 1 - 2','الصبي الذي لا يريده أحد'],def:{theme:0,seed:3,len:1100,px:40,music:0,armed:false,
            onStart(){if(first())say(D.ep1a,()=>say(D.ep1b,()=>say(D.ep1c)));},
            trig:[{x:700,fn(){say(D.ep2a);}}],
            onEnd(){say(D.ep2b,()=>nextEp());}}},
          {card:['الحلقة 3','الاختبار الأول'],def:{theme:0,seed:5,len:W,px:40,music:0,armed:false,
            onStart(){if(first())say(D.ep3a);},
            locks:[{x:0,wave:[{type:'dummy',dx:0},{type:'dummy',dx:60},{type:'dummy',dx:120}],onClear(){say(D.ep3b,()=>nextEp());}}]}},
          {card:['الحلقة 4','السلاح الذي نادى باسمه'],def:{theme:3,seed:9,len:1100,px:40,music:0,armed:false,
            onStart(){if(first())say(D.ep4a);},
            locks:[{x:560,wave:hol(2),onStart(){say(D.ep4b,()=>setArmed(true));}}],
            onEnd(){say(D.ep4c,()=>nextEp());}}},
          {card:['الحلقة 5 - 6','أول مهمة خارج الجدران'],def:{theme:1,seed:11,len:1800,px:40,music:1,armed:true,
            onStart(){if(first())say(D.ep5a);},
            spawns:[{type:'hollow',x:420},{type:'hollow',x:520},{type:'hollow',x:640},{type:'hollow',x:700}],
            locks:[{x:900,wave:hol(3)},{x:1300,wave:hol(3),onStart(){say(D.ep5b);},onClear(){say(D.ep5c);}}],
            onEnd(){say(D.ep6,()=>nextEp());}}},
          {card:['الحلقات 7 - 12','دماء خارج التصنيف · مدينة الأقنعة'],def:{theme:2,seed:14,len:2000,px:40,music:1,armed:true,
            onStart(){if(first())say(D.ep7);},
            spawns:[{type:'hollow',x:380},{type:'hollow',x:500},{type:'hollow',x:620},{type:'hollow',x:760},{type:'hollow',x:820}],
            locks:[{x:1000,wave:hol(4),onClear(){say(D.ep10);}},{x:1500,wave:hol(5),onClear(){say(D.ep10b);}}],
            onEnd(){nextEp();}}},
          {card:['الحلقات 13 - 15','سقوط إيلاريون'],def:{theme:1,seed:17,len:W,px:60,music:1,armed:true,
            onStart(){if(first())say(D.ep13);},
            locks:[{x:0,wave:[{type:'karthus',boss:true}],onClear(){say(D.ep13c,()=>nextEp());}}]}},
          {card:['الحلقات 16 - 18','حقيقة الأم'],def:{theme:2,seed:21,len:800,px:40,music:0,armed:true,
            onStart(){if(first())say(D.ep16);},
            onEnd(){nextEp();}}},
          {card:['خاتمة الموسم الأول','الوريث الذي كرهته الآلهة'],def:{theme:3,seed:25,len:W,px:200,music:0,armed:true,
            onStart(){if(first())say(D.finale,()=>{music(-1);showCard('TO BE CONTINUED...','ILARION — نهاية الموسم الأول',6000,()=>location.reload());});}}}];

          function startEpisode(i){
            const e=EP[i];if(!e)return;
            if(i===5&&!S.kbody){S.kbody=buildKarthus();S.karm=buildKarm();}
            showCard(e.card[0],e.card[1],2600,()=>{
              e.def.retry=0;setArmed(e.def.armed!==false);startLevel(e.def);
            });
          }
          function boot(){
            initEngine();
            S.swordReal=S.lsword;S.blank=mkc(1,1).cv;
            S.kbody=buildKarthus();S.karm=buildKarm();
            startLoop();
            $('startBtn').addEventListener('click',()=>{
              initAudio();$('title').style.display='none';EPI=0;startEpisode(0);
            });
          }
          boot();
          EOF
      - name: Setup Capacitor and Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.levi.ilarion","appName":"ILARION","webDir":"www"}
          EOF
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ilarion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
